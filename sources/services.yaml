# Источник истины. После правки и push в main сборка запускается сама.
#
# Поля сервиса:
#   id          — латиница/цифры/дефис, станет именем файлов в dist/
#   group       — ai | video | social | messengers | dev | other | foreign → агрегаты group-<имя>
#   restriction — rkn (блок РКН) | geoblock (блокирует сам сервис) | throttle (замедление)
#   verified    — подтверждены ли статус и домены источниками
#   in_all      — попадает ли сервис в общий список all (по умолчанию true)
#   domains     — домены; каждый матчится вместе со всеми своими поддоменами
#   regexp      — регулярки (только sing-box, Mihomo, Xray)
#   cidr / asn  — подсети и автономные системы (префиксы ASN берутся из RIPEstat)
#   upstreams   — itdog:<файл>, itdog-cat:<файл>, itdog-ip4:<файл>, itdog-ip6:<файл>,
#                 v2fly:<файл>, domains-url:<url>, cidr-url:<url>
#   exclude     — выкинуть, даже если домен принёс upstream
#   probe       — домены для еженедельной проверки по OONI
#   ct          — шаблоны поиска поддоменов в crt.sh

settings:
  min_total_domains: 200        # если в all меньше — сборка падает и ничего не публикуется
  singbox_ruleset_version: 2    # 2 = sing-box 1.10+; для старых версий поставьте 1
  mikrotik_forward_to: 1.1.1.1  # DNS для заблокированных доменов (маршрут к нему — через VPN)
  keenetic_interface: Wireguard1
  keenetic_chunk: 250           # доменов в одной FQDN-группе Keenetic

# Эти домены целиком добавлять нельзя: суффиксный матчинг унесёт в VPN весь сервис.
shared_roots: [google.com, googleapis.com, gstatic.com, googleusercontent.com, withgoogle.com,
  l.google.com, microsoft.com, cloud.microsoft, bing.com, live.com, apple.com, icloud.com,
  github.com, githubusercontent.com, cloudflare.com, cloudflare.net, amazonaws.com,
  cloudfront.net, azureedge.net, azurefd.net, windows.net, azure.com, akamaiedge.net,
  akamaized.net, sentry.io, datadoghq.com, b-cdn.net, imgix.net, livekit.cloud]

exclude: []

services:
  # ───────────── Google ─────────────
  - id: google-ai
    company: Google
    group: ai
    restriction: geoblock
    verified: true
    upstreams: [itdog:google_ai]
    domains:
      - gemini.google.com
      - gemini.google
      - bard.google.com
      - aistudio.google.com
      - makersuite.google.com
      - alkalimakersuite-pa.clients6.google.com
      - generativelanguage.googleapis.com
      - ai.google.dev
      - generativeai.google
      - geller-pa.googleapis.com
      - proactivebackend-pa.googleapis.com
      - aisandbox-pa.googleapis.com
      - robinfrontend-pa.googleapis.com
      - aida.googleapis.com
      - notebooklm.google.com
      - notebooklm.google
      - labs.google              # Flow, Whisk, ImageFX: labs.google/fx/...
      - opal.withgoogle.com
      - stitch.withgoogle.com
      - jules.google
      - jules.google.com
      - antigravity.google
      - antigravity-pa.googleapis.com
      - antigravity.googleapis.com
      - deepmind.com
      - deepmind.google
      - cloudcode-pa.googleapis.com
    probe: [gemini.google.com]

  - id: youtube
    company: Google
    group: video
    restriction: rkn
    verified: true
    upstreams: [itdog:youtube]
    domains: [youtube.com, youtu.be, youtube-nocookie.com, youtubekids.com, googlevideo.com,
      ytimg.com, ggpht.com, yt3.googleusercontent.com, yt4.googleusercontent.com,
      youtubei.googleapis.com, youtube.googleapis.com, youtubeembeddedplayer.googleapis.com,
      jnn-pa.googleapis.com, youtube-ui.l.google.com, ytimg.l.google.com, ytstatic.l.google.com,
      yt-video-upload.l.google.com, wide-youtube.l.google.com]
    probe: [www.youtube.com]

  - id: google-meet
    company: Google
    group: other
    restriction: throttle
    verified: true
    upstreams: [itdog:google_meet]
    domains: [meet.google.com, meet.googleapis.com, stream.meet.google.com]
    probe: [meet.google.com]

  - id: google-play
    company: Google
    group: other
    restriction: geoblock
    verified: false
    in_all: false
    upstreams: [itdog:google_play]
    domains: [play.google.com, play.googleapis.com, play-fe.googleapis.com, android.clients.google.com]

  # ───────────── OpenAI ─────────────
  - id: openai
    company: OpenAI
    group: ai
    restriction: geoblock
    verified: true
    upstreams: [v2fly:openai]
    domains: [chatgpt.com, chat.com, chatgpt.site, openai.com, openai.org, oaistatic.com,
      oaiusercontent.com, oaistatsig.com, sora.com, chatgpt.livekit.cloud, host.livekit.cloud,
      turn.livekit.cloud, browser-intake-datadoghq.com, o33249.ingest.sentry.io,
      o33249.ingest.us.sentry.io, openai.qualtrics.com, openaiapi-site.azureedge.net,
      openaiassets.blob.core.windows.net, production-openaicom-storage.azureedge.net,
      openaicom.imgix.net, challenges.cloudflare.com]
    regexp: ['^chatgpt-async-webps-prod-\S+-\d+\.webpubsub\.azure\.com$']
    probe: [chatgpt.com]
    ct: ["%.chatgpt.com", "%.openai.com"]

  # ───────────── Anthropic ─────────────
  - id: anthropic
    company: Anthropic
    group: ai
    restriction: geoblock
    verified: true
    upstreams: [v2fly:anthropic]
    domains: [claude.ai, claude.com, anthropic.com, claudeusercontent.com, claude.dev, clau.de,
      claudemcpcontent.com, claudemcpclient.com, claude.app, claude.new, claude.site,
      claudepages.dev, claudestudio.com, antspace.dev, modelcontextprotocol.io,
      http-intake.logs.us5.datadoghq.com, statsig.com, statsigapi.net,
      servd-anthropic-website.b-cdn.net, challenges.cloudflare.com]
    cidr: [160.79.104.0/21]
    probe: [claude.ai]
    ct: ["%.claude.ai", "%.anthropic.com", "%.claude.com"]

  # ───────────── xAI и X ─────────────
  - id: xai
    company: xAI
    group: ai
    restriction: geoblock
    verified: false          # данные о доступности Grok из РФ противоречивы
    upstreams: [v2fly:xai]
    domains: [grok.com, x.ai]
    probe: [grok.com]
    ct: ["%.x.ai", "%.grok.com"]

  - id: twitter
    company: X Corp
    group: social
    restriction: rkn
    verified: true
    upstreams: [itdog:twitter, itdog-ip4:twitter]
    domains: [x.com, twitter.com, t.co, twimg.com, tweetdeck.com, periscope.tv, pscp.tv]
    probe: [x.com, twitter.com]

  # ───────────── Meta ─────────────
  - id: meta
    company: Meta
    group: social
    restriction: rkn
    verified: true
    upstreams: [itdog:meta, itdog-ip4:meta, itdog-ip6:meta]
    asn: [32934]
    domains: [facebook.com, fb.com, fb.me, facebook.net, fbcdn.net, fbsbx.com, fbpigeon.com,
      instagram.com, cdninstagram.com, ig.me, instagr.am, threads.net, threads.com,
      messenger.com, m.me, meta.ai, meta.com, oculus.com, oculuscdn.com, workplace.com]
    probe: [www.facebook.com, www.instagram.com]

  - id: whatsapp
    company: Meta
    group: messengers
    restriction: rkn
    verified: true
    asn: [32934]             # звонки и медиа идут по IP — без подсетей не заработают
    domains: [whatsapp.com, whatsapp.net, wa.me, wl.co, whatsapp.cc, whatsapp.org,
      whatsappbrand.com, whatsapp.info, whatsapp.tv]
    probe: [web.whatsapp.com]

  # ───────────── Telegram ─────────────
  - id: telegram
    company: Telegram
    group: messengers
    restriction: rkn
    verified: true
    upstreams:
      - itdog:telegram
      - v2fly:telegram
      - itdog-ip4:telegram
      - cidr-url:https://core.telegram.org/resources/cidr.txt
    asn: [62041, 59930, 62014, 44907]   # AS211157 не подтверждена — добавьте после проверки
    domains: [telegram.org, t.me, telegram.me, telegram.dog, tx.me, telesco.pe, tdesktop.com,
      tg.dev, cdn-telegram.org, telegram-cdn.org, usercontent.dev, telegram.space, telegra.ph,
      graph.org, fragment.com, comments.app, contest.com]
    probe: [telegram.org, web.telegram.org]
    ct: ["%.telegram.org"]

