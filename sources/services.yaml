  - {id: patreon, company: Patreon, group: other, restriction: rkn, verified: true, domains: [patreon.com, patreonusercontent.com]}
  - {id: soundcloud, company: SoundCloud, group: other, restriction: rkn, verified: true, domains: [soundcloud.com, sndcdn.com]}
