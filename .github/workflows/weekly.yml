name: weekly-report

on:
  schedule:
    - cron: "0 6 * * 1"        # по понедельникам
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Поиск новых поддоменов (crt.sh)
        run: python scripts/discover.py
      - name: Проверка по OONI
        run: python scripts/verify_ooni.py
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: weekly-report
          title: "Еженедельный отчёт: поддомены и статус OONI"
          commit-message: "weekly report"
          add-paths: |
            reports/**
          body: |
            - `reports/candidates/` — найденные хосты, не покрытые текущим списком. Нужное перенесите в `sources/services.yaml`.
            - `reports/inventory/` — полный перечень известных хостов по сервисам.
            - `reports/ooni.md` — доля аномалий по измерениям из России за 14 дней.
